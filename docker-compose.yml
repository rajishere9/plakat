# Plakat + PostgreSQL.  Usage:
#   cp .env.example .env   # optional: set POSTGRES_PASSWORD, PUBLIC_URL, BASIC_AUTH, Openverse keys
#   docker compose up -d --build
#   open http://localhost:8787
#
# Plakat has no user accounts. The port below is published on all host interfaces;
# set PLAKAT_BIND=127.0.0.1 to keep it local, and put an authenticating reverse proxy
# (or BASIC_AUTH) in front before anyone else can reach it.
#
# .env is only used for ${...} substitution in this file: a variable reaches the app
# container only if it is listed under app.environment.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plakat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plakat}
      POSTGRES_DB: plakat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plakat -d plakat"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: plakat:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # POSTGRES_PASSWORD must be URL-safe (or percent-encoded) because it is embedded here.
      DATABASE_URL: postgres://plakat:${POSTGRES_PASSWORD:-plakat}@db:5432/plakat
      PORT: "8787"
      HOST: 0.0.0.0
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      BASIC_AUTH: ${BASIC_AUTH:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-40}
      OPENVERSE_API_URL: ${OPENVERSE_API_URL:-https://api.openverse.org}
      OPENVERSE_CLIENT_ID: ${OPENVERSE_CLIENT_ID:-}
      OPENVERSE_CLIENT_SECRET: ${OPENVERSE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PLAKAT_BIND:-0.0.0.0}:${PLAKAT_PORT:-8787}:8787"
    volumes:
      - plakat-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  plakat-data:
